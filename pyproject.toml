[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gotestwaf"
version = "0.1.0"
description = "API and OWASP attack simulation tool for evaluating WAF/API security solutions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Wallarm", email = "support@wallarm.com" },
]
keywords = ["waf", "security", "testing", "owasp", "api-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "ruamel.yaml>=0.18.0",
    "typer>=0.12.0",
    "structlog>=24.1.0",
    "orjson>=3.9.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
    "openapi-core>=0.19.0",
    "email-validator>=2.1.0",
    "tqdm>=4.66.0",
    "jinja2>=3.1.0",
    "playwright>=1.42.0",
    "anyio>=4.3.0",
    "lxml>=5.1.0",
    "croniter>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.98.0",
    "mypy>=1.8.0",
    "pyright>=1.1.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "coverage>=7.4.0",
]

[project.scripts]
gotestwaf = "gotestwaf.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gotestwaf"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "TCH", "PL", "RUF", "ASYNC",
    "S", "C4", "RET", "ARG", "PTH", "ERA", "PIE", "T20", "ICN",
    "ISC", "INP", "FBT", "BLE", "A", "COM", "DTZ", "EM", "EXE",
    "FA", "G", "INT", "LOG", "PGH", "PYI", "Q", "SLF", "SLOT",
    "TID", "TRY", "YTT",
]
ignore = ["S101", "COM812", "ISC001", "T201", "EM101", "EM102", "TRY003", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
